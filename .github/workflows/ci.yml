name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SECURITY_TEST_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: python -m ruff check . && python -m ruff format --check .
      - run: python -m mypy app
      - run: python -m pytest -q
      - name: Audit locked runtime and development dependencies
        run: |
          python -m venv /tmp/auditor
          /tmp/auditor/bin/pip install pip-audit
          /tmp/auditor/bin/pip-audit -r requirements.lock --disable-pip --no-deps
          /tmp/auditor/bin/pip-audit -r requirements-dev.lock --disable-pip --no-deps
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: https://api.routewright.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies for schema export
        run: pip install --require-hashes -r ../backend/requirements-dev.lock
        working-directory: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check && npm run lint
      - name: Check generated TypeScript types are not stale
        run: npm run check:types-drift
      - run: npm run security:audit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run security:smoke
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verified gitleaks binary and scan history
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o checksums.txt
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git --redact --log-opts='--all' .
          ./gitleaks dir --redact backend
          ./gitleaks dir --redact frontend
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t routewright-security-check backend
      - name: Verify non-root container and health endpoint
        run: |
          docker run --name routewright-check -d -p 8000:8000 -e APP_ENV=test routewright-security-check
          test "$(docker exec routewright-check id -u)" != "0"
          curl --retry 20 --retry-all-errors --retry-delay 1 --fail http://localhost:8000/healthz
          docker stop routewright-check
